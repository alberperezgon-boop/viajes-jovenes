<meta charset="utf-8">
<title>GoLiveIt Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* GoLiveIt Planner. Escritorio primero: panel de viaje | mapa central | viajes posibles. Cobalto + mandarina, mapa como lienzo. */
:root {
  --bg: #EEF0F8; --surface: #FFFFFF; --surface-2: #ECEEF8; --ink: #0E1330; --muted: #555C7B; --line: #D9DDEE;
  --brand: #1730D6; --brand-2: #3049E4; --brand-fg: #FFFFFF; --brand-dim: #C9D0FF; --pop: #FF7A2F; --pop-ink: #1E0B00;
  --link: #1730D6; --sea: #CFE0F7; --land: #F8F9FD; --border-c: #B9C2DE; --arc: #1730D6;
  --ok: #17784A; --ok-soft: #DDF2E5; --req: #8C5200; --req-soft: #FDEBC8; --no: #B3261E; --no-soft: #FBE0DC; --unk: #5B6272; --unk-soft: #E6E8EE;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #080A18; --surface: #13162B; --surface-2: #1C2040; --ink: #EEF0FB; --muted: #A3A9C6; --line: #2A2F52;
  --brand: #1626B8; --brand-2: #2B3CD0; --link: #A2B3FF; --sea: #0E1733; --land: #1B2142; --border-c: #34406E; --arc: #FF9A5C;
  --ok: #5ACB8E; --ok-soft: #14301F; --req: #F3B54E; --req-soft: #36280D; --no: #FF8B80; --no-soft: #3A1614; --unk: #A6AEBE; --unk-soft: #262A35;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #080A18; --surface: #13162B; --surface-2: #1C2040; --ink: #EEF0FB; --muted: #A3A9C6; --line: #2A2F52;
  --brand: #1626B8; --brand-2: #2B3CD0; --link: #A2B3FF; --sea: #0E1733; --land: #1B2142; --border-c: #34406E; --arc: #FF9A5C;
  --ok: #5ACB8E; --ok-soft: #14301F; --req: #F3B54E; --req-soft: #36280D; --no: #FF8B80; --no-soft: #3A1614; --unk: #A6AEBE; --unk-soft: #262A35;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; line-height: 1.45;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 112%; margin: 0; line-height: 1.12; text-wrap: balance; }
h2 { font-size: 1.08rem; font-weight: 820; }
h3 { font-size: 0.96rem; font-weight: 760; }
p { margin: 0; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }
button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.eyebrow { font-family: var(--f-mono); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

/* Estructura de escritorio */
.app { height: 100%; display: grid; grid-template-columns: 370px minmax(0, 1fr) 410px; grid-template-rows: auto minmax(0, 1fr); }
.top { grid-column: 1 / -1; background: var(--brand); color: var(--brand-fg); display: flex; align-items: center; gap: 16px; padding: 10px 18px; }
.wm { font-family: var(--f-display); font-stretch: 125%; font-weight: 900; font-size: 1.25rem; letter-spacing: -0.01em; }
.wm span { color: var(--pop); }
.top .tag { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.1em; color: var(--brand-dim); text-transform: uppercase; }
.top .spacer { flex: 1; }
.seg { display: inline-flex; background: rgb(255 255 255 / 0.12); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; color: var(--brand-dim); border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: 0.78rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--pop); color: var(--pop-ink); }
.tbtn { border: 1px solid rgb(255 255 255 / 0.35); background: transparent; color: var(--brand-fg); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
.tbtn.solid { background: var(--pop); border-color: var(--pop); color: var(--pop-ink); }
.panel { background: var(--surface); overflow: auto; min-width: 0; display: grid; align-content: start; gap: 16px; padding: 16px; }
.panel.left { border-right: 1px solid var(--line); }
.panel.right { border-left: 1px solid var(--line); }
.mapwrap { position: relative; min-width: 0; background: var(--sea); }
#map { position: absolute; inset: 0; }
@media (max-width: 1100px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto auto; height: auto; } .panel { overflow: visible; } .panel.left { order: 3; } .panel.right { order: 4; } }

/* Controles */
.btn { border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 800; cursor: pointer; background: var(--ink); color: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.btn.pop { background: var(--pop); color: var(--pop-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
@media (hover: hover) { .btn:hover, .tbtn:hover { filter: brightness(1.1); } .chip:hover, .card:hover { border-color: var(--muted); } }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .label { font-weight: 700; font-size: 0.82rem; }
.input { width: 100%; border: 1.5px solid var(--line); background: var(--land); border-radius: 10px; padding: 8px 10px; min-width: 0; }
textarea.input { resize: vertical; min-height: 88px; line-height: 1.4; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 0.78rem; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.slot { font-size: 0.78rem; font-weight: 700; border-radius: 8px; padding: 3px 8px; background: var(--surface-2); }
.slot.miss { background: var(--req-soft); color: var(--req); }
input[type="range"] { width: 100%; accent-color: var(--pop); }
.box { border: 1.5px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }

/* Grupo */
.member { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.member:first-of-type { border-top: 0; padding-top: 0; }
.member-head { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 6px; align-items: center; }
.likes { display: flex; gap: 4px; flex-wrap: wrap; }
.likes .chip { padding: 2px 8px; font-size: 0.72rem; }
.icon-btn { border: 0; background: var(--surface-2); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-weight: 800; }

/* Estados */
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 800; border-radius: 999px; padding: 2px 8px 2px 3px; white-space: nowrap; }
.status .g { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 0.64rem; color: var(--surface); }
.s-ok { background: var(--ok-soft); color: var(--ok); } .s-ok .g { background: var(--ok); }
.s-req { background: var(--req-soft); color: var(--req); } .s-req .g { background: var(--req); }
.s-no { background: var(--no-soft); color: var(--no); } .s-no .g { background: var(--no); }
.s-unk { background: var(--unk-soft); color: var(--unk); } .s-unk .g { background: var(--unk); }
.mchip { font-size: 0.7rem; font-weight: 700; border-radius: 6px; padding: 1px 6px; }
.stamp { display: inline-block; font-family: var(--f-mono); font-size: 0.6rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 5px; padding: 1px 6px; color: var(--link); }
.stamp.t-EQUIPO { color: var(--ok); }
.stamp.t-SIN-VERIFICAR, .stamp.t-PENDIENTE, .stamp.t-SECUNDARIA { color: var(--unk); border-style: dashed; }
.tipo { font-family: var(--f-mono); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* Tarjetas de viaje */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.summary div { background: var(--surface); padding: 8px 10px; display: grid; }
.summary b { font-family: var(--f-mono); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.summary span { font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.cards { display: grid; gap: 10px; }
.card { border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); display: grid; }
.card.sel { border-color: var(--ink); box-shadow: 4px 4px 0 var(--pop); }
.card-ph { height: 86px; position: relative; background: linear-gradient(120deg, var(--brand), var(--pop)); background-size: cover; background-position: center; }
.card-ph .score { position: absolute; right: 10px; bottom: -14px; background: var(--ink); color: var(--surface); border: 3px solid var(--surface); border-radius: 14px; padding: 2px 9px; font-family: var(--f-mono); font-weight: 800; font-size: 1.05rem; }
.card-ph .mono { position: absolute; left: 12px; bottom: 8px; font-family: var(--f-mono); font-weight: 800; font-size: 1.6rem; color: #fff; text-shadow: 0 2px 8px rgb(0 0 0 / 0.4); }
.card-body { padding: 14px 12px 12px; display: grid; gap: 8px; }
.card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card-title strong { font-family: var(--f-display); font-stretch: 112%; font-weight: 850; font-size: 1.12rem; }
.why { margin: 0; padding-left: 16px; display: grid; gap: 2px; font-size: 0.8rem; }
.budget { display: grid; gap: 4px; }
.bar { position: relative; display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.bar i { display: block; height: 100%; }
.bar .cap { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.legend-b { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.7rem; color: var(--muted); }
.legend-b i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.warn { font-size: 0.78rem; font-weight: 700; color: var(--req); }
.bad { font-size: 0.8rem; font-weight: 700; color: var(--no); }

/* Detalle */
.detail-head { position: relative; height: 130px; border-radius: 16px; overflow: hidden; background: linear-gradient(120deg, var(--brand), var(--pop)); background-size: cover; background-position: center; }
.detail-head .cap { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; justify-content: space-between; align-items: end; gap: 8px; }
.detail-head h2 { background: var(--brand); color: var(--brand-fg); padding: 4px 10px 5px; border-radius: 10px; font-size: 1.3rem; }
.detail-head .credit { position: absolute; top: 6px; right: 6px; font-size: 0.62rem; background: rgb(0 0 0 / 0.5); color: #fff; padding: 1px 6px; border-radius: 5px; text-decoration: none; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 6px 4px; font-weight: 700; font-size: 0.78rem; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
.day { display: grid; gap: 6px; }
.stop { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 0.84rem; }
.stop .n { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 800; font-size: 0.72rem; }
.stop.skip { opacity: 0.6; }
.stop.skip .n { background: var(--no); }
.etable { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.etable th, .etable td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.etable th { font-weight: 700; color: var(--muted); font-size: 0.7rem; }
.legal-item { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; }
.legal-item .row { gap: 5px; }
.pill { font-size: 0.66rem; font-weight: 800; border-radius: 999px; padding: 1px 7px; text-transform: uppercase; letter-spacing: 0.04em; }
.e-obligatorio { background: var(--no-soft); color: var(--no); } .e-recomendado { background: var(--ok-soft); color: var(--ok); }
.e-segun_caso { background: var(--req-soft); color: var(--req); } .e-pendiente { background: var(--unk-soft); color: var(--unk); }
.who { background: var(--surface-2); color: var(--ink); }

/* Mapa: marcadores y controles */
.mk { position: relative; border: 0; background: none; cursor: pointer; padding: 0; transform: translateY(-50%); }
.mk .dot { display: grid; place-items: center; border-radius: 50%; border: 3px solid var(--surface); color: #fff; font-family: var(--f-mono); font-weight: 800; box-shadow: 0 4px 12px rgb(0 0 0 / 0.25); transition: transform 0.2s ease; }
.mk .lbl { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 3px; white-space: nowrap; font-weight: 800; font-size: 0.72rem; background: var(--surface); color: var(--ink); padding: 1px 6px; border-radius: 6px; box-shadow: 0 1px 4px rgb(0 0 0 / 0.15); }
.mk.sel .dot { transform: scale(1.18); outline: 3px solid var(--pop); }
.mk.origin .dot { background: var(--ink); }
.mk.stopmk .dot { width: 24px; height: 24px; font-size: 0.7rem; background: var(--brand); }
.mk.stopmk.skip .dot { background: var(--no); }
.maptools { position: absolute; right: 12px; top: 12px; display: grid; gap: 6px; z-index: 3; }
.maptools button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; cursor: pointer; }
.maplegend { position: absolute; left: 12px; bottom: 12px; z-index: 3; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 4px; font-size: 0.72rem; max-width: 280px; }
.attrib { position: absolute; right: 8px; bottom: 6px; z-index: 3; font-size: 0.62rem; background: rgb(255 255 255 / 0.8); color: #222; padding: 1px 6px; border-radius: 5px; }
.attrib a { color: #1730D6; }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 4; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 8px 12px; font-size: 0.8rem; max-width: 80%; }
.maplibregl-map { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-marker { position: absolute; top: 0; left: 0; will-change: transform; }

/* Diálogos */
dialog.sheet { border: 0; padding: 0; width: min(760px, calc(100% - 32px)); max-height: 88vh; border-radius: 20px; background: var(--surface); color: var(--ink); overscroll-behavior: contain; }
dialog.sheet::backdrop { background: rgb(8 10 20 / 0.55); }
.sheet-in { padding: 20px; display: grid; gap: 14px; }
.sheet-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.pipeline { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.pipeline div { background: var(--surface-2); border-radius: 12px; padding: 8px; font-size: 0.74rem; display: grid; gap: 3px; align-content: start; }
.pipeline div b { font-size: 0.78rem; }
.pipeline div.hard { background: var(--no-soft); color: var(--no); }
.rt { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.rt th, .rt td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.rise { animation: rise 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <span class="wm">Go<span>Live</span>It</span>
    <span class="tag">Planner · prototipo de investigación</span>
    <span class="spacer"></span>
    <span class="seg" role="group" aria-label="Tipo de mapa" id="mapmode"></span>
    <button type="button" class="tbtn" id="pause" aria-pressed="false">Pausar animaciones</button>
    <button type="button" class="tbtn" data-open="how">Cómo funciona</button>
    <button type="button" class="tbtn solid" data-open="papeles">Papeles y dificultades</button>
  </header>

  <aside class="panel left" aria-label="Tu viaje">
    <div class="field">
      <label for="nl">Cuéntanos el viaje</label>
      <textarea class="input" id="nl" spellcheck="false">Somos cuatro amigos de 17 años, salimos de Sevilla, tenemos 250 € por persona y queremos pasar cuatro días en una ciudad europea con ambiente joven, playa y actividades.</textarea>
      <div class="row"><button type="button" class="btn pop sm" id="parse">Entender y buscar</button><span class="small muted">Intérprete de demostración: reglas, no IA.</span></div>
      <div class="row" id="slots" aria-live="polite"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="origin">Salida</label><select class="input" id="origin"></select></div>
      <div class="field"><label for="days">Días</label><input class="input" id="days" type="number" min="2" max="7" value="4"></div>
    </div>
    <div class="field">
      <label for="budget">Presupuesto por persona: <span id="budget-v"></span></label>
      <input id="budget" type="range" min="100" max="700" step="10" value="250">
    </div>
    <div class="box">
      <div class="row between"><h3>Grupo</h3><button type="button" class="btn ghost sm" id="add-member">Añadir</button></div>
      <p class="small muted">Cada persona marca sus gustos: así se ven los conflictos y cómo se resuelven.</p>
      <div id="members"></div>
    </div>
  </aside>

  <section class="mapwrap" aria-label="Mapa">
    <div id="map"></div>
    <div class="maptools"><button type="button" id="zin" aria-label="Acercar">+</button><button type="button" id="zout" aria-label="Alejar">−</button><button type="button" id="zeu" aria-label="Ver Europa">⌂</button></div>
    <div class="maplegend" id="maplegend"></div>
    <div class="attrib" id="attrib"></div>
    <div class="toast" id="toast" hidden role="status"></div>
  </section>

  <aside class="panel right" aria-label="Viajes posibles">
    <div id="results"></div>
  </aside>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"><div class="sheet-in" id="sheet-in"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.10/datamaps.world.min.js"></script>
<script>
(() => {
  /* =========================================================
     DATOS INYECTADOS AL CONSTRUIR (build.mjs)

  const PHOTOS = /*__PHOTOS__*/{};

  const EQ = (label, url, date = "07/11/2026") => S(label, url, "EQUIPO", date);
  const SRC = {
    interior: S("FAQ de Interior, Instrucción 10/2019 SES", "https://web.guardiacivil.es/export/sites/guardiaCivil/documentos/pdfs/2024/FAQ_autorizacion_viaje_menores.pdf", "VERIFICADO", MIA),
    vueling: S("Ayuda de Vueling: menores", "https://help.vueling.com/hc/es/articles/19798828271633-Menores-no-acompa%C3%B1ados", "OFICIAL-INDIRECTO", MIA),
    ryanair: S("Ryanair: viajar con niños", "https://help.ryanair.com/hc/en-sk/sections/12503179588113-Travelling-With-Children-Travelling-With-Children", "OFICIAL-INDIRECTO", MIA),
    iberia: S("Iberia: menores", "https://www.iberia.com/us/fly-with-iberia/minors/", "OFICIAL-INDIRECTO", MIA),

  function budgetBar(a) {

      ${rest.length ? `<h3>Descartados o pendientes</h3><div class="cards">${rest.map(a => `<article class="card"><div class="card-body"><div class="card-title"><strong>${esc(a.d.city)}</strong>${pill(a.status)}</div><p class="small">${esc(a.reason)}</p><div class="row"><button type="button" class="btn ghost sm" data-dest="${a.k}">Por qué</button></div></div></article>`).join("")}</div>` : ""}

  function renderDetail() {

  function eligTable(a) {

      ${rows.map(r => `<tr><td><strong>${esc(r.name)}</strong><br><span class="tipo">${TIPOS[r.e.it.tipo]}</span></td>${r.e.per.map(x => `<td title="${esc(x.r.why)}"><span class="status ${STATUS[x.r.s][0]}" style="padding:2px" aria-label="${STATUS[x.r.s][2]}"><span class="g" aria-hidden="true">${STATUS[x.r.s][1]}</span></span></td>`).join("")}<td>${SRC[r.e.it.src].url ? `<a href="${SRC[r.e.it.src].url}" target="_blank" rel="noopener">${esc(SRC[r.e.it.src].label)}</a><br>` : ""}<span class="tipo">${esc(SRC[r.e.it.src].tag)} · ${esc(SRC[r.e.it.src].date)}</span></td></tr>`).join("")}</table></div>`;

  function docsBlock(a) { // agrupa a quienes necesitan exactamente los mismos papeles

  /* =========================================================
     CICLO
     ========================================================= */
  function update(animate) { renderLeft(); renderResults(animate); renderModes(); refreshMap(); }
  document.addEventListener("click", ev => {
    const t = ev.target.closest("button"); if (!t) return; const d = t.dataset;
    if (t.id === "parse") { const p = parseQuery($("#nl").value); applyParsed(p); update(true); if (state.sel) flyTo(state.sel); else flyEurope(); }
    else if (d.dest) { state.sel = d.dest; state.tab = "itinerario"; update(true); flyTo(d.dest); }
    else if (d.back !== undefined) { state.sel = null; update(true); flyEurope(); }
    else if (d.tab) { state.tab = d.tab; renderResults(); }
    else if (d.like) { const [id, k] = d.like.split(":"); const m = state.group.find(x => String(x.id) === id); if (m) { m.likes.has(k) ? m.likes.delete(k) : m.likes.add(k); update(); } }
    else if (d.remove) { state.group = state.group.filter(m => String(m.id) !== d.remove); update(); }
    else if (t.id === "add-member") { if (state.group.length < 6) { state.group.push({ id: state.nextId++, name: "Amigo " + (state.nextId - 1), age: 17, nat: "ES", likes: new Set(["joven"]) }); update(); } }
    else if (d.mode) { if (d.mode === "mapbox" && !getToken()) { openHow(); toast("Para usar Mapbox, guarda primero tu token público."); return; } state.mapMode = d.mode; renderModes(); if (map) map.setStyle(styleFor(d.mode)); $("#attrib").innerHTML = ATTRIB[d.mode]; }
    else if (d.open === "papeles") openPapeles();

    else if (d.lcuando) { state.legalFilter.cuando = d.lcuando; openPapeles(); }
    else if (t.id === "mb-save") { const v = $("#mb-token").value.trim(); if (!/^pk\./.test(v)) { toast("Usa un token público: empieza por pk."); return; } try { localStorage.setItem("goliveit-mapbox-token", v); } catch (e) { /* sin almacenamiento */ } openHow(); toast("Token guardado en este navegador."); }
    else if (t.id === "mb-clear") { try { localStorage.removeItem("goliveit-mapbox-token"); } catch (e) { /* nada */ } if (state.mapMode === "mapbox") { state.mapMode = "offline"; renderModes(); if (map) map.setStyle(styleFor("offline")); } openHow(); }
    else if (t.id === "copy-check") {
      const country = state.legalFilter.dest === "auto" ? (state.sel ? DEST[state.sel].country : null) : (state.legalFilter.dest === "todos" ? null : state.legalFilter.dest);
      const txt = "GoLiveIt · Papeles del viaje\n" + legalItems(country).map(i => `- [${ESTADO[i.estado] || i.estado}] ${i.titulo} (${i.quien}): ${i.url}`).join("\n");
      const msg = m => { const el = $("#copy-msg"); if (el) el.textContent = m; };
      try { navigator.clipboard.writeText(txt).then(() => msg("Lista copiada."), () => msg("No se pudo copiar.")); } catch (e) { msg("No se pudo copiar."); }
    }
    else if (t.id === "zin") map && map.zoomIn();
    else if (t.id === "zout") map && map.zoomOut();
    else if (t.id === "zeu") { state.sel = null; update(); flyEurope(); }
    else if (t.id === "pause") { const p = document.documentElement.classList.toggle("paused"); t.setAttribute("aria-pressed", String(p)); t.textContent = p ? "Reanudar animaciones" : "Pausar animaciones"; animateArcs(); }
  });
  document.addEventListener("change", ev => {
    const el = ev.target;
    if (el.dataset.cmp) { el.checked ? state.compare.add(el.dataset.cmp) : state.compare.delete(el.dataset.cmp); if (state.compare.size > 3) { state.compare.delete(el.dataset.cmp); el.checked = false; toast("Compara como mucho tres destinos."); } renderResults(); return; }
    if (el.dataset.m) { const m = state.group.find(x => String(x.id) === el.dataset.m); if (!m) return; if (el.dataset.f === "age") m.age = +el.value; if (el.dataset.f === "name") m.name = el.value.trim() || "Sin nombre"; update(); return; }
    if (el.id === "origin") { state.origin = el.value; update(); }
    if (el.id === "days") { state.days = Math.max(2, Math.min(7, +el.value || 4)); update(); }
    if (el.id === "lf-dest") { state.legalFilter.dest = el.value; openPapeles(); }
    if (el.id === "lf-quien") { state.legalFilter.quien = el.value; openPapeles(); }
  });
  document.addEventListener("input", ev => { if (ev.target.id === "budget") { state.budget = +ev.target.value; $("#budget-v").textContent = eur(state.budget); renderResults(); refreshMap(); } });
  $("#sheet").addEventListener("click", ev => { if (ev.target === $("#sheet")) $("#sheet").close(); });

  /* Fotos como fondos compartidos (se decodifican una vez) */
  (function injectPhotos() { const css = Object.entries(PHOTOS).map(([k, u]) => `.ph-${k}.ph-${k}{background-image:url("${u}");background-size:cover}`).join(""); if (css) { const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st); } })();

  state.parsed = parseQuery($("#nl").value);
  initMap();
  update(true);
  animateArcs();
})();
</script>
